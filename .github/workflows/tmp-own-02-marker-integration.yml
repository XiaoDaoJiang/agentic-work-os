name: Temporary integrate OWN-02 ownership markers

on:
  push:
    branches:
      - spike/runtime-receipt-ownership-v2
    paths:
      - .github/workflows/tmp-own-02-marker-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ownership branch
        uses: actions/checkout@v6
        with:
          ref: spike/runtime-receipt-ownership-v2
      - name: Verify frozen targets
        shell: bash
        run: |
          test "$(git hash-object experiments/milestone-0/native-runner/src/hostile_probe.rs)" = "fa52cb3a5fe7df53f2bfed1207c7fbc7770d0540"
          test "$(git hash-object experiments/milestone-0/native-runner/tests/runtime_ownership_markers.rs)" = "55b353d9138afea2b999c79be8f30b0ac9818a68"
      - name: Apply exact OWN-02 probe patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('experiments/milestone-0/native-runner/src/hostile_probe.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''use crate::hostile_evidence::{\n    HostileEvidence, HostileVerdict, evaluate_physical_verdict, record_cleanup_outcome,\n};\nuse crate::windows_observer::{\n''',
                  '''use crate::hostile_evidence::{\n    HostileEvidence, HostileVerdict, evaluate_physical_verdict, record_cleanup_outcome,\n};\nuse crate::runtime_receipt::OwnershipMarkers;\nuse crate::windows_observer::{\n'''
              ),
              (
                  '''    pub seed: u32,\n    pub repetition: u32,\n}\n''',
                  '''    pub seed: u32,\n    pub repetition: u32,\n    pub ownership_markers: Option<OwnershipMarkers>,\n}\n'''
              ),
              (
                  '''        let seed = required_u32(&mut values, "seed")?;\n        let repetition = required_u32(&mut values, "repetition")?;\n\n        if !values.is_empty() {\n''',
                  '''        let seed = required_u32(&mut values, "seed")?;\n        let repetition = required_u32(&mut values, "repetition")?;\n        let runtime_instance_id = values\n            .remove("runtime-instance-id")\n            .map(|value| {\n                value\n                    .into_string()\n                    .map_err(|_| "--runtime-instance-id must be UTF-8".to_owned())\n            })\n            .transpose()?;\n        let run_id = values\n            .remove("run-id")\n            .map(|value| {\n                value\n                    .into_string()\n                    .map_err(|_| "--run-id must be UTF-8".to_owned())\n            })\n            .transpose()?;\n        let spawn_nonce = values\n            .remove("spawn-nonce")\n            .map(|value| {\n                value\n                    .into_string()\n                    .map_err(|_| "--spawn-nonce must be UTF-8".to_owned())\n            })\n            .transpose()?;\n        let ownership_markers = match (runtime_instance_id, run_id, spawn_nonce) {\n            (Some(runtime_instance_id), Some(run_id), Some(spawn_nonce)) => {\n                if runtime_instance_id.trim().is_empty()\n                    || run_id.trim().is_empty()\n                    || spawn_nonce.trim().is_empty()\n                {\n                    return Err("ownership marker values must not be blank".to_owned());\n                }\n                Some(OwnershipMarkers {\n                    runtime_instance_id,\n                    run_id,\n                    spawn_nonce,\n                })\n            }\n            (None, None, None) => None,\n            _ => {\n                return Err(\n                    "--runtime-instance-id, --run-id, and --spawn-nonce must be supplied together"\n                        .to_owned(),\n                );\n            }\n        };\n\n        if !values.is_empty() {\n'''
              ),
              (
                  '''            sample_ms,\n            seed,\n            repetition,\n        })\n''',
                  '''            sample_ms,\n            seed,\n            repetition,\n            ownership_markers,\n        })\n'''
              ),
              (
                  '''        .stdin(Stdio::null())\n        .stdout(Stdio::piped())\n        .stderr(Stdio::piped());\n    let mut child = group\n''',
                  '''        .stdin(Stdio::null())\n        .stdout(Stdio::piped())\n        .stderr(Stdio::piped());\n    if let Some(markers) = config.ownership_markers.as_ref() {\n        command\n            .env("AGENTIC_RUNTIME_ID", &markers.runtime_instance_id)\n            .env("AGENTIC_RUN_ID", &markers.run_id)\n            .env("AGENTIC_SPAWN_NONCE", &markers.spawn_nonce);\n    }\n    let mut child = group\n'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact replacement count was {count}, expected 1 for:\n{old[:160]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Set up Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format native runner
        run: cargo fmt --manifest-path experiments/milestone-0/native-runner/Cargo.toml
      - name: Commit integration only
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(experiments/milestone-0/native-runner/src/hostile_probe.rs|experiments/milestone-0/native-runner/tests/runtime_ownership_markers.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/milestone-0/native-runner/src/hostile_probe.rs experiments/milestone-0/native-runner/tests/runtime_ownership_markers.rs
          git commit -m "feat(m0): inject OWN-02 ownership markers"
          git push origin HEAD:spike/runtime-receipt-ownership-v2
