name: Temporary M0 Linux observer GREEN v2

on:
  push:
    branches:
      - spike/linux-cgroup-v2-final-window-observer

permissions:
  contents: write

jobs:
  verify-patch:
    name: Verify patch v2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Apply corrected prospective Linux observer integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/zz-m0-linux-observer-green.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'linux-observer-green-v1', 'exec'))

          source = Path('experiments/milestone-0/native-runner/src/hostile_probe.rs')
          text = source.read_text(encoding='utf-8')

          dead_field = '    final_members_after_window: Vec<u32>,\n'
          dead_init = '        final_members_after_window: final_members,\n'
          if text.count(dead_field) != 1 or text.count(dead_init) != 1:
              raise SystemExit('unexpected final_members_after_window internal shape')
          text = text.replace(dead_field, '', 1).replace(dead_init, '', 1)

          non_linux_stub_vec = '    _samples: &mut Vec<LinuxTruthSample>,\n'
          if text.count(non_linux_stub_vec) != 1:
              raise SystemExit('unexpected non-Linux LinuxTruthSample stub shape')
          text = text.replace(
              non_linux_stub_vec,
              '    _samples: &mut [LinuxTruthSample],\n',
              1,
          )

          source.write_text(text, encoding='utf-8')
          PY
      - name: Format
        shell: bash
        run: cargo fmt --manifest-path experiments/milestone-0/native-runner/Cargo.toml
      - name: Run Rust tests
        shell: bash
        run: cargo test --locked --manifest-path experiments/milestone-0/native-runner/Cargo.toml
      - name: Clippy
        shell: bash
        run: cargo clippy --locked --manifest-path experiments/milestone-0/native-runner/Cargo.toml --all-targets -- -D warnings
      - name: Preserve patched source
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: linux-observer-green-source-v2
          path: experiments/milestone-0/native-runner/src/hostile_probe.rs
          retention-days: 1

  commit-green:
    name: Commit GREEN v2
    needs: verify-patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: spike/linux-cgroup-v2-final-window-observer
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - uses: actions/download-artifact@v8
        with:
          name: linux-observer-green-source-v2
          path: /tmp/linux-observer-green-v2
      - name: Install verified source and remove one-shot workflows
        shell: bash
        run: |
          cp /tmp/linux-observer-green-v2/hostile_probe.rs experiments/milestone-0/native-runner/src/hostile_probe.rs
          cargo fmt --manifest-path experiments/milestone-0/native-runner/Cargo.toml
          git rm .github/workflows/zz-m0-linux-observer-green.yml
          git rm .github/workflows/zz-m0-linux-observer-green-v2.yml
          git diff --check
      - name: Commit and push GREEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/milestone-0/native-runner/src/hostile_probe.rs
          git commit -m "test(m0): integrate Linux final-window observer"
          git push origin HEAD:spike/linux-cgroup-v2-final-window-observer
