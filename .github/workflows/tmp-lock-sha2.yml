name: Temporary lock SHA-256 dependency

on:
  push:
    branches:
      - spike/runtime-receipt-ownership-v2
    paths:
      - .github/workflows/tmp-lock-sha2.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RuntimeReceipt branch
        uses: actions/checkout@v6
        with:
          ref: spike/runtime-receipt-ownership-v2
      - name: Set up Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Add pinned sha2 dependency and update lock only
        run: cargo add sha2@=0.11.0 --manifest-path experiments/milestone-0/native-runner/Cargo.toml
      - name: Verify existing ProcessKit pin survived
        run: grep -F 'processkit = "=3.3.4"' experiments/milestone-0/native-runner/Cargo.toml
      - name: Commit dependency lock
        shell: bash
        run: |
          git diff --exit-code -- . ':(exclude)experiments/milestone-0/native-runner/Cargo.toml' ':(exclude)experiments/milestone-0/native-runner/Cargo.lock' || {
            echo "Unexpected files changed" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/milestone-0/native-runner/Cargo.toml experiments/milestone-0/native-runner/Cargo.lock
          git commit -m "build(m0): pin sha2 for RuntimeReceipt evidence"
          git push origin HEAD:spike/runtime-receipt-ownership-v2
