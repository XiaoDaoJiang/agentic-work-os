name: M0 cross-platform Stage B transport

on:
  push:
    branches:
      - spike/milestone-0-cross-platform
    paths:
      - .github/workflows/m0-cross-platform-stage-b.yml
      - experiments/milestone-0/fixtures/stage-b-child.mjs
      - experiments/milestone-0/src/stage-b-client.mjs
      - experiments/milestone-0/test/stage-b-runner.integration.test.mjs
      - experiments/milestone-0/native-runner/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-b:
    name: Stage B (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0

      - name: Set up Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Build Stage B runner
        run: >-
          cargo build --locked
          --manifest-path experiments/milestone-0/native-runner/Cargo.toml
          --bin stage-b-runner

      - name: Check Rust formatting
        run: cargo fmt --manifest-path experiments/milestone-0/native-runner/Cargo.toml -- --check

      - name: Run Rust Clippy
        run: >-
          cargo clippy --locked
          --manifest-path experiments/milestone-0/native-runner/Cargo.toml
          --bin stage-b-runner
          -- -D warnings

      - name: Configure Stage B paths
        working-directory: experiments/milestone-0
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable="$PWD/native-runner/target/debug/stage-b-runner.exe"
          else
            executable="$PWD/native-runner/target/debug/stage-b-runner"
          fi
          echo "STAGE_B_RUNNER=$executable" >> "$GITHUB_ENV"
          echo "STAGE_B_SUMMARY=$PWD/stage-b-summary.json" >> "$GITHUB_ENV"

      - name: Run the common Stage B integration suite
        working-directory: experiments/milestone-0
        run: node --test test/stage-b-runner.integration.test.mjs

      - name: Upload Stage B summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage-b-summary-${{ matrix.os }}
          path: experiments/milestone-0/stage-b-summary.json
          if-no-files-found: warn
          retention-days: 14
