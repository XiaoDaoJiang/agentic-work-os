[package]
name = "containment-provider-eval"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Throwaway Milestone 0 spike for comparing Rust containment providers"

[dependencies]
processkit = "=3.3.4"
process-wrap = { version = "=10.0.0", default-features = false, features = ["std", "job-object", "process-group"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects"] }
